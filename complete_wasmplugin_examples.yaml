# Example 5: Multi-Plugin Consumer Configuration
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: consumer-security-suite
  namespace: higress-system
  labels:
    app: higress
    scope: consumer
    suite: security
spec:
  phase: AUTHN
  priority: 850
  url: oci://registry.cn-hangzhou.aliyuncs.com/higress/security-suite:1.0.0
  matchRules:
  # High-security consumers get comprehensive protection
  - consumer:
    - "financial-partner-001"
    - "healthcare-client-001"
    - "government-service-001"
    config:
      # Rate limiting
      rateLimit:
        requests: 5000
        window: 60s
        burst: 500
      
      # IP restrictions
      ipRestriction:
        allowedIPs:
          - "203.0.113.0/24"
          - "198.51.100.0/24"
        denyMessage: "Access denied: High-security consumer"
      
      # Request validation
      requestValidation:
        maxRequestSize: 1048576  # 1MB
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
        requiredHeaders:
          - "Authorization"
          - "X-Request-ID"
        blockedHeaders:
          - "X-Debug"
          - "X-Internal"
      
      # Response security
      responseSecurity:
        removeServerHeaders: true
        addSecurityHeaders:
          "X-Content-Type-Options": "nosniff"
          "X-Frame-Options": "DENY"
          "X-XSS-Protection": "1; mode=block"
          "Strict-Transport-Security": "max-age=31536000; includeSubDomains"
      
      # Logging and monitoring
      logging:
        logLevel: "INFO"
        logRequests: true
        logResponses: false
        logHeaders: true
        sensitiveHeaders:
          - "Authorization"
          - "X-API-Key"
      
      # Alerting
      alerting:
        enableRateLimitAlerts: true
        enableSecurityAlerts: true
        alertThreshold: 100
        alertWindow: 300  # 5 minutes
  
  # Standard consumers get basic protection
  - consumer:
    - "standard-partner-001"
    - "standard-partner-002"
    config:
      rateLimit:
        requests: 1000
        window: 60s
        burst: 100
      
      requestValidation:
        maxRequestSize: 524288  # 512KB
        allowedMethods:
          - "GET"
          - "POST"
      
      responseSecurity:
        removeServerHeaders: true
        addSecurityHeaders:
          "X-Content-Type-Options": "nosniff"
      
      logging:
        logLevel: "WARN"
        logRequests: false
        logResponses: false
  
  # Default security configuration
  rateLimit:
    requests: 100
    window: 60s
    burst: 10
  
  requestValidation:
    maxRequestSize: 262144  # 256KB
    allowedMethods:
      - "GET"
  
  responseSecurity:
    removeServerHeaders: true
  
  logging:
    logLevel: "ERROR"
    logRequests: false
    logResponses: false

---
# Example 6: Consumer-Level Observability Plugin
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: consumer-observability
  namespace: higress-system
  labels:
    app: higress
    scope: consumer
    category: observability
spec:
  phase: STATS
  priority: 100  # Low priority, runs after other plugins
  url: oci://registry.cn-hangzhou.aliyuncs.com/higress/observability:1.0.0
  matchRules:
  # Premium consumers get detailed metrics and tracing
  - consumer:
    - "premium-user-001"
    - "enterprise-client-001"
    config:
      metrics:
        enableDetailedMetrics: true
        customMetrics:
          - name: "consumer_requests_total"
            type: "counter"
            labels:
              - "consumer_id"
              - "method"
              - "status_code"
          - name: "consumer_request_duration"
            type: "histogram"
            labels:
              - "consumer_id"
              - "endpoint"
            buckets: [0.1, 0.5, 1.0, 2.5, 5.0, 10.0]
      
      tracing:
        enableTracing: true
        samplingRate: 1.0  # 100% sampling for premium
        customTags:
          consumer_id: "{consumer_id}"
          consumer_tier: "premium"
          business_unit: "{business_unit}"
      
      logging:
        enableAccessLogs: true
        logFormat: "json"
        customFields:
          consumer_id: "{consumer_id}"
          request_id: "{request_id}"
          processing_time: "{processing_time}"
          upstream_service: "{upstream_service}"
  
  # Standard consumers get basic metrics
  - consumer:
    - "standard-user-001"
    - "api-partner-001"
    config:
      metrics:
        enableDetailedMetrics: false
        customMetrics:
          - name: "consumer_requests_total"
            type: "counter"
            labels:
              - "consumer_id"
              - "status_code"
      
      tracing:
        enableTracing: true
        samplingRate: 0.1  # 10% sampling for standard
        customTags:
          consumer_id: "{consumer_id}"
          consumer_tier: "standard"
      
      logging:
        enableAccessLogs: false
  
  # Default minimal observability
  metrics:
    enableDetailedMetrics: false
    customMetrics:
      - name: "requests_total"
        type: "counter"
        labels:
          - "status_code"
  
  tracing:
    enableTracing: false
  
  logging:
    enableAccessLogs: false