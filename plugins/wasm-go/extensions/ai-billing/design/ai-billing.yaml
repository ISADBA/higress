apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-billing
  namespace: higress-system
spec:
  defaultConfig:
    billingService:
      # 使用 McpBridge 中注册的服务名称
      serviceAddress: billing-service.internal.dns
      protocol: http
      port: 8888
    failPricingMessage: "503 Pricing Information Unavailable"
    failBalanceMessage: "503 Billing Service Balance Unavailable"
    insufficientBalanceMessage: "余额不足"
    failCostMessage: "503 Billing Service Cost Unavailable"
  defaultConfigDisable: false
  failStrategy: FAIL_CLOSE
  imagePullPolicy: UNSPECIFIED_POLICY
  phase: UNSPECIFIED_PHASE
  priority: 200
  imagePullSecret: isadba-registry-secret
  url: oci://crpi-0vih3w2g8se3zbl8.cn-hangzhou.personal.cr.aliyuncs.com/ociplugins/ai-billing:2.0.0-tenant