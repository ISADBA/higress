apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  annotations:
    higress.io/wasm-plugin-description: Test plugin for scope priority mechanism with full metadata printing.
    higress.io/wasm-plugin-title: Scope Priority Test
  labels:
    higress.io/wasm-plugin-category: observability
    higress.io/wasm-plugin-name: scope-priority-test
    higress.io/wasm-plugin-version: 1.0.0
  name: scope-priority-test
  namespace: higress-system
spec:
  # 全局默认配置 (GLOBAL scope - 最低优先级)
  defaultConfig:
    scopeType: GLOBAL
    message: This is global config
    priority: 1
    enableRequestHeaders: true
    enableResponseHeaders: true
    enableRequestBody: true
    enableResponseBody: true
  
  defaultConfigDisable: false
  
  # 匹配规则 - 按优先级从高到低测试
  matchRules:
    # 规则 1: CONSUMER 作用域 (最高优先级)
    - config:
        scopeType: CONSUMER
        message: This is consumer-level config for premium-user
        priority: 100
        enableRequestHeaders: true
        enableResponseHeaders: true
        enableRequestBody: true
        enableResponseBody: true
      configDisable: false
      # consumer 字段用于匹配 consumer 名称
      consumer:
        - premium-user
        - enterprise-user
    
    # 规则 2: ROUTE 作用域 (第二优先级)
    - config:
        scopeType: ROUTE
        message: This is route-level config for test-route
        priority: 80
        enableRequestHeaders: true
        enableResponseHeaders: true
        enableRequestBody: false
        enableResponseBody: false
      configDisable: false
      # ingress 字段用于匹配路由名称
      ingress:
        - test-route
        - api-route
    
    # 规则 3: SERVICE 作用域 (第三优先级)
    - config:
        scopeType: SERVICE
        message: This is service-level config for test-service
        priority: 70
        enableRequestHeaders: true
        enableResponseHeaders: false
        enableRequestBody: false
        enableResponseBody: false
      configDisable: false
      # service 字段用于匹配服务名称
      service:
        - test-service.default.svc.cluster.local
        - backend-service.default.svc.cluster.local
    
    # 规则 4: DOMAIN 作用域 (第四优先级)
    - config:
        scopeType: DOMAIN
        message: This is domain-level config for example.com
        priority: 60
        enableRequestHeaders: true
        enableResponseHeaders: true
        enableRequestBody: false
        enableResponseBody: false
      configDisable: false
      # domain 字段用于匹配域名
      domain:
        - example.com
        - "*.example.com"
        - test.example.com
  
  # 插件执行阶段
  phase: UNSPECIFIED_PHASE
  
  # 插件优先级
  priority: 0
  
  # 失败策略
  failStrategy: FAIL_CLOSE
  
  # 镜像拉取策略
  imagePullPolicy: IfNotPresent
  
  # WASM 插件镜像 URL (需要替换为实际构建的镜像地址)
  url: oci://your-registry/scope-priority-test:1.0.0
