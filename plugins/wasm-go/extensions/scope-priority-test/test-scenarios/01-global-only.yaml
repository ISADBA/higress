apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: scope-priority-test-global-only
  namespace: higress-system
spec:
  # 测试场景 1: 只有 GLOBAL 配置
  # 预期结果: 所有请求都使用 GLOBAL 配置
  defaultConfig:
    scopeType: GLOBAL
    message: "[TEST-01] Global config only - should apply to all requests"
    priority: 1
    enableRequestHeaders: true
    enableResponseHeaders: true
    enableRequestBody: true
    enableResponseBody: true
  
  defaultConfigDisable: false
  phase: UNSPECIFIED_PHASE
  priority: 0
  url: oci://your-registry/scope-priority-test:1.0.0
