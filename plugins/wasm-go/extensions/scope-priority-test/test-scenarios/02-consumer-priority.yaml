apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: scope-priority-test-consumer-priority
  namespace: higress-system
spec:
  # 测试场景 2: GLOBAL + CONSUMER 配置
  # 预期结果: 
  #   - consumer=premium-user 的请求使用 CONSUMER 配置
  #   - 其他请求使用 GLOBAL 配置
  defaultConfig:
    scopeType: GLOBAL
    message: "[TEST-02] Global config - fallback for non-consumer requests"
    priority: 1
    enableRequestHeaders: true
    enableResponseHeaders: true
    enableRequestBody: false
    enableResponseBody: false
  
  defaultConfigDisable: false
  
  matchRules:
    - config:
        scopeType: CONSUMER
        message: "[TEST-02] Consumer config - HIGHEST PRIORITY - should override global"
        priority: 100
        enableRequestHeaders: true
        enableResponseHeaders: true
        enableRequestBody: true
        enableResponseBody: true
      configDisable: false
      consumer:
        - premium-user
  
  phase: UNSPECIFIED_PHASE
  priority: 0
  url: oci://your-registry/scope-priority-test:1.0.0
